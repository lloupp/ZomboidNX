name: Metadata scanner tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile syntax
        run: python -m compileall -q tools tests
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v

  switch-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Switch diagnostic (.nro)
        run: make
      - uses: actions/upload-artifact@v7
        with:
          name: zomboidnx-nro
          path: zomboidnx.nro
